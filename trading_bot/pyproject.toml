[project]
name = "tradingbot"
version = "0.1.0"
description = "Modular trading bot: strategies, risk management, backtesting, paper and live trading"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
live = ["ccxt>=4.0"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.setuptools]
packages = ["tradingbot", "tradingbot.strategies"]
